version: '3.8'

services:
  creden-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creden-portal
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=creden-aicte-secure-hmac-jwt-secret-key-2024
      - VERIFICATION_SIGNING_KEY=creden-aicte-tamper-evident-ed25519-sha256-signing-key
    volumes:
      - creden_data:/app/prisma

volumes:
  creden_data:
